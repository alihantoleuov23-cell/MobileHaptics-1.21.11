name: Cleanup corrupted tree

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Remove corrupted paths
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = "main";

            const ref = await github.rest.git.getRef({
              owner,
              repo,
              ref: `heads/${branch}`
            });

            const headSha = ref.data.object.sha;

            core.info(`Current main: ${headSha}`);

            const treeResponse = await github.rest.git.getTree({
              owner,
              repo,
              tree_sha: headSha,
              recursive: "1"
            });

            const corruptedPrefix =
              "src/main/java/ru/mobilehaptics/NativeVibrator.java\n";

            const badExactPath =
              "src/main/java/com/alihantoleuov/mobilevibration/MobileVibrationMod.java";

            const deletions = treeResponse.data.tree
              .filter(entry => {
                const corruptedDirectory =
                  entry.type === "tree" &&
                  entry.path.startsWith(corruptedPrefix);

                const strayMainClass =
                  entry.type === "blob" &&
                  entry.path === badExactPath;

                return corruptedDirectory || strayMainClass;
              })
              .map(entry => ({
                path: entry.path,
                mode: entry.mode,
                type: entry.type,
                sha: null
              }));

            if (deletions.length === 0) {
              core.info("Nothing to clean.");
              return;
            }

            core.info("Entries to delete:");

            for (const entry of deletions) {
              core.info(`- ${JSON.stringify(entry.path)}`);
            }

            const newTree = await github.rest.git.createTree({
              owner,
              repo,
              base_tree: headSha,
              tree: deletions
            });

            const newCommit = await github.rest.git.createCommit({
              owner,
              repo,
              message: "Remove corrupted generated paths",
              tree: newTree.data.sha,
              parents: [headSha]
            });

            await github.rest.git.updateRef({
              owner,
              repo,
              ref: `heads/${branch}`,
              sha: newCommit.data.sha
            });

            core.info(`Created cleanup commit: ${newCommit.data.sha}`);